databases:
  - name: club-db
    databaseName: club
    user: club_user
    plan: free

services:
  - type: web
    name: club-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: club-db
          property: connectionString
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APP_TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: worker
    name: club-notifications
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.notifications.worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: club-db
          property: connectionString
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APP_TIMEZONE
        value: America/Argentina/Buenos_Aires
